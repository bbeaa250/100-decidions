<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPI HT 01 | Review trail</title><style>body{margin:0;background:#07111f;color:#e9f1fb;font:15px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:1200px;margin:auto;padding:28px 20px}.eyebrow{color:#54d6b5;letter-spacing:.12em;text-transform:uppercase;font-size:12px;font-weight:700}h1{font-size:38px;line-height:1.1}a{color:#54d6b5}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill{border:1px solid #24364d;border-radius:999px;padding:7px 10px;color:#9db0c7}table{width:100%;border-collapse:collapse;background:#0f1d2f;border-radius:14px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid #24364d;text-align:left;vertical-align:top}th{color:#9db0c7;font-size:13px}small{color:#9db0c7}tr.low{background:#2d2117}tr.material{background:#102a35}.answer{min-width:280px}</style></head><body><main><div class="eyebrow">DPI-HT-01 · assessor view</div><h1>AI review trail and certified decisions</h1><p><a href="/">← Back to overview</a></p><div id="summary" class="bar"></div><table><thead><tr><th>ID</th><th>Question</th><th>Certified answer</th><th>Evidence</th><th>Confidence</th><th>Independent challenge</th></tr></thead><tbody id="rows"></tbody></table></main><script>fetch('/submission.json').then(r=>r.json()).then(d=>{let m=d.decisions.filter(x=>x.reviewTier==='material_judgment');document.getElementById('summary').innerHTML=`<span class="pill">100 total decisions</span><span class="pill">${m.length} material judgments</span><span class="pill">${d.decisions.filter(x=>x.confidence==='low').length} low confidence</span>`;document.getElementById('rows').innerHTML=d.decisions.map(x=>`<tr class="${x.reviewTier==='material_judgment'?'material':''} ${x.confidence==='low'?'low':''}"><td><b>${x.id}</b><br><small>${x.reviewTier}</small></td><td>${x.question}</td><td class="answer">${x.answer}</td><td>${x.evidence.join('<br>')}</td><td>${x.confidence}</td><td>${x.independentChallenge||'Operational certification: evidence matched and treatment recorded.'}</td></tr>`).join('')})</script></body></html>
