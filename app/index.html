<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DPI HT 01 | Financial crime-scene review</title><style>
:root{--bg:#07111f;--panel:#0f1d2f;--ink:#e9f1fb;--muted:#9db0c7;--line:#24364d;--accent:#54d6b5;--warn:#f5c66a;--bad:#f28b82}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0b1727 55%,#102a35);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:1200px;margin:auto;padding:32px 22px 70px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}.eyebrow{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:12px;font-weight:700}h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:8px 0 12px;max-width:780px}h2{margin:0 0 12px;font-size:24px}p{color:var(--muted)}.nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:10px;margin-left:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:rgba(15,29,47,.9);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:30px;font-weight:750}.label{color:var(--muted);font-size:13px}.section{margin-top:22px}.wide{grid-column:span 2}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.pass{background:#123d35;color:var(--accent)}.review{background:#4a3513;color:var(--warn)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:13px}.small{font-size:14px;color:var(--muted)}ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}header{display:block}.nav{margin-top:18px}.nav a{margin:0 8px 0 0;display:inline-block}}@media(max-width:480px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}
</style></head><body><main><header><div><div class="eyebrow">Bad Decisions Capital · DPI-HT-01</div><h1>Divorce Party International: evidence-led reconstruction</h1><p>Reporting date: 31 August 2026 · EUR · 100 certified decisions</p></div><div class="nav"><a href="/">Overview</a><a href="/review">Review</a><a href="/submission.json">JSON</a></div></header><div id="app"></div></main><script>
fetch('/submission.json').then(r=>r.json()).then(d=>{const s=d.statements,b=d.balanceSheet||s.balanceSheet;document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Delivered revenue</div><div class="metric">€${s.profitAndLoss.revenue.toLocaleString()}</div></div><div class="card"><div class="label">Net profit</div><div class="metric">€${s.profitAndLoss.netProfit.toLocaleString()}</div></div><div class="card"><div class="label">Closing cash</div><div class="metric">€${s.cashFlow.closingCash.toLocaleString()}</div></div><div class="card"><div class="label">Balance check</div><div class="metric">€${b.balanceCheck.toLocaleString()}</div></div></div><div class="section grid"><div class="card wide"><h2>Board recommendation</h2><p>${d.boardRecommendation.recommendation}</p></div><div class="card wide"><h2>Material uncertainty</h2><ul>${d.uncertainties.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><div class="section card"><h2>Three statements</h2><table><tr><th>Statement</th><th>Key result</th><th>Status</th></tr><tr><td>Profit and loss</td><td>Revenue €${s.profitAndLoss.revenue.toLocaleString()} · COGS €${s.profitAndLoss.cogs.toLocaleString()} · Net profit €${s.profitAndLoss.netProfit.toLocaleString()}</td><td><span class="status review">Review variance</span></td></tr><tr><td>Cash flow</td><td>Opening cash €${s.cashFlow.openingCash.toLocaleString()} → closing cash €${s.cashFlow.closingCash.toLocaleString()}</td><td><span class="status pass">Bank agrees</span></td></tr><tr><td>Balance sheet</td><td>Assets €${b.totalAssets.toLocaleString()} · Liabilities €${b.totalLiabilities.toLocaleString()} · Equity €${b.equity.toLocaleString()}</td><td><span class="status pass">Balances</span></td></tr></table></div><div class="section card"><h2>Decision coverage</h2><p>${d.decisions.length} decisions loaded, including ${d.decisions.filter(x=>x.reviewTier==='material_judgment').length} material judgments with proposal, independent challenge, reasoning and statement-effect fields.</p><p class="small">Strongest evidence: bank records, signed contracts, third-party invoices, warehouse/delivery records. Management spreadsheets and messages are treated as lower reliability.</p></div>`})
</script></body></html>
